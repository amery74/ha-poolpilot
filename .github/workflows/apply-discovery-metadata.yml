name: Apply discovery metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sensor metadata and version
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('custom_components/pool_pilot/sensor.py')
          s = p.read_text()
          old = '''        if self.entity_description.key in ("alert_status", "action_summary"):\n            attrs = dict(attrs or {})\n            attrs["notification_preferences"] = self.coordinator.notification_preferences()\n        return attrs or None'''
          new = '''        attrs = {**self.pool_pilot_discovery_attributes, **dict(attrs or {})}\n        if self.entity_description.key in ("alert_status", "action_summary"):\n            attrs["notification_preferences"] = self.coordinator.notification_preferences()\n        return attrs'''
          if old not in s:
              raise SystemExit('sensor extra_state_attributes block not found')
          p.write_text(s.replace(old, new, 1))

          for filename in ['custom_components/pool_pilot/const.py', 'custom_components/pool_pilot/manifest.json']:
              p = Path(filename)
              s = p.read_text()
              s = s.replace('1.4.0-beta', '1.4.1-beta')
              p.write_text(s)
          PY
      - name: Validate Python
        run: |
          python -m compileall -q custom_components/pool_pilot
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/pool_pilot/sensor.py custom_components/pool_pilot/const.py custom_components/pool_pilot/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: expose discovery metadata for dashboard"
          git push
